<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced DJ Beat Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.58/build/Tone.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: 29, 78, 216; /* Blue-600 */
            --secondary: 245, 158, 11; /* Amber */
            --background: 17, 24, 39; /* Gray-900 */
            --card: 31, 41, 55; /* Gray-800 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: rgb(var(--background));
            color: #E5E7EB; /* Gray-200 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Start from the top for better mobile view */
        }
        .container {
            max-width: 650px;
            width: 95%;
            margin: 20px auto;
        }
        .step-button {
            transition: all 0.1s;
            transform: scale(0.95);
            border: 2px solid rgba(var(--primary), 0.3);
            background-color: rgba(255, 255, 255, 0.05);
        }
        .step-button.active-kick {
            background-color: rgba(var(--primary), 0.8);
            border-color: rgb(var(--primary));
            box-shadow: 0 0 8px rgba(var(--primary), 0.5);
            transform: scale(1.0);
        }
        .step-button.active-snare {
            background-color: rgba(var(--secondary), 0.8);
            border-color: rgb(var(--secondary));
            box-shadow: 0 0 8px rgba(var(--secondary), 0.5);
            transform: scale(1.0);
        }
        .step-button.active-hihat {
            background-color: rgba(6, 182, 212, 0.8); /* Cyan */
            border-color: rgb(6, 182, 212);
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
            transform: scale(1.0);
        }
        .step-button:hover {
             transform: scale(1.05);
        }
        .step-button:active {
             transform: scale(0.9);
        }
    </style>
</head>
<body class="p-4">

    <div class="container bg-gray-800 p-6 rounded-2xl shadow-2xl space-y-6">
        <h1 class="text-3xl font-extrabold text-center text-blue-400">Multi-Track Beat Mixer</h1>
        <p class="text-gray-400 text-center mb-6">Upload your track, select a drum kit, and create your custom rhythm patterns below.</p>

        <!-- Status Message -->
        <div id="statusMessage" class="bg-blue-900/50 text-blue-300 p-3 rounded-lg text-sm text-center font-semibold transition-opacity duration-300 opacity-0">
            Awaiting Upload...
        </div>

        <!-- 1. Track, Tempo & Kit Controls -->
        <div class="p-4 bg-gray-900 rounded-xl shadow-inner space-y-4">
            <h2 class="text-xl font-bold text-gray-200">Controls</h2>

            <!-- File Upload -->
            <label class="block">
                <span class="text-sm font-medium text-gray-400">Upload Track:</span>
                <input type="file" id="audioFile" accept="audio/*" class="block w-full text-sm text-gray-400
                  file:mr-4 file:py-2 file:px-4
                  file:rounded-full file:border-0
                  file:text-sm file:font-semibold
                  file:bg-blue-500/10 file:text-blue-300
                  hover:file:bg-blue-500/20"
                />
            </label>

            <!-- BPM Control -->
            <div class="flex items-center space-x-4">
                <label for="bpmInput" class="text-gray-400 font-medium whitespace-nowrap">BPM:</label>
                <input type="number" id="bpmInput" value="128" min="60" max="200" step="1"
                       class="w-20 p-2 rounded-lg bg-gray-700 text-center border border-gray-600 focus:ring-blue-500 focus:border-blue-500"
                       oninput="handleBPMChange(this.value)"
                >
                <input type="range" id="bpmRange" value="128" min="60" max="200" step="1" class="flex-grow h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer range-lg" oninput="handleBPMChange(this.value)">
            </div>

            <!-- Kit Selector -->
            <div class="flex items-center space-x-4 pt-2">
                <label for="kitSelector" class="text-gray-400 font-medium whitespace-nowrap">Drum Kit:</label>
                <select id="kitSelector" onchange="updateInstruments()"
                        class="flex-grow p-2 rounded-lg bg-gray-700 text-white border border-gray-600 focus:ring-blue-500 focus:border-blue-500">
                    <option value="electronic">🔊 Electronic Kit</option>
                    <option value="jazz">🥁 Jazz/Acoustic Kit</option>
                </select>
            </div>
        </div>

        <!-- 2. Main Play Controls -->
        <div class="grid grid-cols-2 gap-4">
            <button id="playButton" onclick="togglePlayback()"
                    class="p-4 rounded-xl font-bold text-lg bg-blue-600 hover:bg-blue-700 transition duration-150 disabled:bg-gray-600 shadow-lg shadow-blue-500/30"
                    disabled>
                ▶️ Play / Resume
            </button>
            <button id="stopButton" onclick="stopPlayback()"
                    class="p-4 rounded-xl font-bold text-lg bg-red-600 hover:bg-red-700 transition duration-150 disabled:bg-gray-600 shadow-lg shadow-red-500/30">
                ⏹️ Stop
            </button>
        </div>

        <!-- 3. Sequencer Grid -->
        <div class="p-4 bg-gray-900 rounded-xl shadow-inner space-y-4">
            <h2 class="text-xl font-bold text-gray-200">Rhythm Sequencer (16 Steps)</h2>
            
            <!-- Step Labels -->
            <div class="grid grid-cols-16 gap-1 text-xs font-semibold text-gray-500 pb-2">
                <span class="text-center text-blue-400">1</span><span></span><span class="text-center">3</span><span></span><span class="text-center text-blue-400">5</span><span></span><span class="text-center">7</span><span></span>
                <span class="text-center text-blue-400">9</span><span></span><span class="text-center">11</span><span></span><span class="text-center text-blue-400">13</span><span></span><span class="text-center">15</span><span></span>
            </div>

            <!-- Kick Track -->
            <div class="flex items-center space-x-4">
                <div class="w-20 text-blue-400 font-bold">Kick</div>
                <div id="kickSequencer" class="grid grid-cols-16 gap-1 flex-grow"></div>
            </div>

            <!-- Snare Track -->
            <div class="flex items-center space-x-4">
                <div class="w-20 text-amber-400 font-bold">Snare</div>
                <div id="snareSequencer" class="grid grid-cols-16 gap-1 flex-grow"></div>
            </div>

            <!-- Hi-Hat Track -->
            <div class="flex items-center space-x-4">
                <div class="w-20 text-cyan-400 font-bold">Hi-Hat</div>
                <div id="hihatSequencer" class="grid grid-cols-16 gap-1 flex-grow"></div>
            </div>

            <p class="text-xs text-gray-500 pt-2">Program your beat across 16 steps (one full measure).</p>
        </div>

    </div>

    <script>
        // --- Global Variables (Necessary to fulfill single-file mandate) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Sequencer Constants ---
        const STEPS = 16;
        const TRACKS = ['kick', 'snare', 'hihat'];
        const TRACK_CLASSES = { 'kick': 'active-kick', 'snare': 'active-snare', 'hihat': 'active-hihat' };
        
        // --- Audio State & Sequencer Data ---
        let mainPlayer = null; 
        let drumSynths = {}; // Stores all Tone.js instruments
        let sequencer = null; // Stores the main Tone.Sequence
        let isToneInitialized = false;

        // Sequencer data structure: { kick: [false, false, ...], snare: [...], hihat: [...] }
        let sequenceData = {
            kick: Array(STEPS).fill(false).map((_, i) => i % 4 === 0), // Default 4-on-the-floor
            snare: Array(STEPS).fill(false).map((_, i) => i % 8 === 4), // Default Snare on 5th step
            hihat: Array(STEPS).fill(false).map((_, i) => i % 2 === 1) // Default HiHat on every off-beat
        };

        // --- Instrument Definitions (The different "Kits") ---
        const InstrumentMap = {
            'electronic': {
                'kick': new Tone.MembraneSynth({ pitchDecay: 0.05, envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 0.01 } }),
                'snare': new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.05 } }),
                'hihat': new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 } }),
            },
            'jazz': {
                'kick': new Tone.MembraneSynth({ pitchDecay: 0.02, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.05 } }), // Softer, rounder kick
                'snare': new Tone.NoiseSynth({ noise: { type: "brown" }, envelope: { attack: 0.02, decay: 0.15, sustain: 0, release: 0.05 } }), // Brush/Rimshot sound
                'hihat': new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.005, decay: 0.2, sustain: 0, release: 0.05 } }), // Open hat for complexity
            }
        };


        // --- DOM Elements ---
        const audioFileInput = document.getElementById('audioFile');
        const playButton = document.getElementById('playButton');
        const stopButton = document.getElementById('stopButton');
        const statusMessage = document.getElementById('statusMessage');
        const bpmInput = document.getElementById('bpmInput');
        const bpmRange = document.getElementById('bpmRange');
        const kitSelector = document.getElementById('kitSelector');


        // Utility to display status messages
        function showStatus(message, color = 'blue') {
            statusMessage.textContent = message;
            statusMessage.className = `bg-${color}-900/50 text-${color}-300 p-3 rounded-lg text-sm text-center font-semibold transition-opacity duration-300 opacity-100`;
        }

        // --- TONE.JS Initialization & Setup ---

        function updateInstruments() {
            if (!isToneInitialized) return;

            const selectedKit = kitSelector.value;
            const kit = InstrumentMap[selectedKit];

            // Dispose of old synths if they exist
            if (drumSynths.kick) drumSynths.kick.dispose();
            if (drumSynths.snare) drumSynths.snare.dispose();
            if (drumSynths.hihat) drumSynths.hihat.dispose();

            // Assign new synths
            drumSynths = {
                kick: kit.kick.toDestination(),
                snare: kit.snare.toDestination(),
                hihat: kit.hihat.toDestination(),
            };

            // Adjust volumes for better mix
            drumSynths.kick.volume.value = -6;
            drumSynths.snare.volume.value = -10;
            drumSynths.hihat.volume.value = -14;

            showStatus(`Kit changed to ${selectedKit.toUpperCase()}!`, 'blue');
        }

        function initializeTone() {
            if (isToneInitialized) return;
            showStatus("Initializing Audio Engine...");

            // 1. Initialize Instruments (default to electronic)
            updateInstruments(); 

            // 2. Main Sequencer (runs on 16th notes)
            // The callback function fires on every step (0-15)
            sequencer = new Tone.Sequence((time, step) => {
                
                // --- Step Logic ---
                if (sequenceData.kick[step]) {
                    drumSynths.kick.triggerAttackRelease("C1", "16n", time);
                }
                if (sequenceData.snare[step]) {
                    drumSynths.snare.triggerAttackRelease("16n", time);
                }
                if (sequenceData.hihat[step]) {
                    drumSynths.hihat.triggerAttackRelease("16n", time);
                }
                
                // --- Visual Step Indicator ---
                Tone.Draw.schedule(() => {
                    const allButtons = document.querySelectorAll('.step-button');
                    // Remove all highlights
                    allButtons.forEach(btn => btn.classList.remove('ring-2', 'ring-white/50'));
                    
                    // Highlight current step across all tracks
                    document.querySelectorAll(`[data-step="${step}"]`).forEach(btn => {
                        btn.classList.add('ring-2', 'ring-white/50');
                    });

                }, time);

            }, Array.from({ length: STEPS }, (_, i) => i), "16n").start(0); // Sequence runs on 16th notes

            isToneInitialized = true;
            showStatus("Audio Engine Ready. Upload your track.");
        }


        // --- Audio File Handling (Same as before) ---

        audioFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (!isToneInitialized) { initializeTone(); }

            showStatus(`Loading "${file.name}"...`, 'blue');

            if (mainPlayer) { mainPlayer.stop(); mainPlayer.dispose(); }
            Tone.Transport.stop();

            mainPlayer = new Tone.Player({
                url: URL.createObjectURL(file),
                onload: () => {
                    playButton.disabled = false;
                    mainPlayer.loop = true;
                    mainPlayer.volume.value = -10;
                    showStatus(`Track loaded successfully! Press Play.`, 'blue');
                },
                onerror: (e) => {
                    playButton.disabled = true;
                    showStatus("Error loading track. Is it a valid audio file?", 'red');
                    console.error("Audio loading error:", e);
                }
            }).toDestination();
        });


        // --- Playback Controls ---

        async function togglePlayback() {
            if (!mainPlayer || !mainPlayer.loaded) {
                showStatus("Please upload a track first.", 'red');
                return;
            }

            await Tone.start();
            
            // Check if any steps are active. If not, set a default beat so sound plays.
            const hasActiveSteps = Object.values(sequenceData).some(track => track.some(active => active));
            if (!hasActiveSteps) {
                showStatus("No beat programmed! Playing 4-on-the-floor kick only.", 'blue');
                sequenceData.kick = Array(STEPS).fill(false).map((_, i) => i % 4 === 0);
                renderSequencerState();
            }


            if (Tone.Transport.state !== 'started') {
                Tone.Transport.bpm.value = parseInt(bpmInput.value, 10);
                mainPlayer.start(0);
                Tone.Transport.start();
                playButton.textContent = '⏸️ Pause';
                showStatus(`Playing at ${Tone.Transport.bpm.value} BPM. Beat is synced!`, 'blue');

            } else {
                Tone.Transport.pause();
                mainPlayer.stop(); 
                playButton.textContent = '▶️ Play / Resume';
                showStatus("Paused.", 'blue');
            }
        }

        function stopPlayback() {
            Tone.Transport.stop();
            if (mainPlayer) { mainPlayer.stop(); }
            playButton.textContent = '▶️ Play / Resume';
            showStatus("Stopped. Ready to play.", 'blue');
            
            // Clear all step highlights
            document.querySelectorAll('.step-button').forEach(btn => btn.classList.remove('ring-2', 'ring-white/50'));
        }

        // --- BPM Handling ---

        function handleBPMChange(newBPM) {
            const bpmValue = Math.min(Math.max(parseInt(newBPM, 10), 60), 200); 
            
            bpmInput.value = bpmValue;
            bpmRange.value = bpmValue;

            if (isToneInitialized) {
                Tone.Transport.bpm.value = bpmValue;
                if (Tone.Transport.state === 'started') {
                    showStatus(`BPM changed to ${bpmValue}. Beat is adjusting...`, 'blue');
                }
            }
        }


        // --- Sequencer UI & Logic ---

        function createSequencerGrid() {
            TRACKS.forEach(trackName => {
                const grid = document.getElementById(`${trackName}Sequencer`);
                grid.innerHTML = ''; // Clear existing
                
                for (let i = 0; i < STEPS; i++) {
                    const button = document.createElement('button');
                    const isDownBeat = (i % 4 === 0); // Quarter notes
                    
                    button.classList.add(
                        'step-button', 
                        'w-full', 
                        'h-6', 
                        'rounded-md', 
                        isDownBeat ? 'bg-gray-700/50' : 'bg-gray-700/20'
                    );
                    
                    button.dataset.track = trackName;
                    button.dataset.step = i;
                    button.onclick = () => toggleStep(trackName, i, button);
                    grid.appendChild(button);
                }
            });
            renderSequencerState();
        }

        function toggleStep(trackName, stepIndex, button) {
            sequenceData[trackName][stepIndex] = !sequenceData[trackName][stepIndex];
            button.classList.toggle(TRACK_CLASSES[trackName], sequenceData[trackName][stepIndex]);
        }
        
        // Renders the internal sequenceData onto the UI buttons
        function renderSequencerState() {
            document.querySelectorAll('.step-button').forEach(button => {
                const trackName = button.dataset.track;
                const stepIndex = parseInt(button.dataset.step);
                
                button.classList.remove(TRACK_CLASSES[trackName]); // Clear first
                if (sequenceData[trackName][stepIndex]) {
                    button.classList.add(TRACK_CLASSES[trackName]);
                }
            });
        }


        // --- Initial Setup ---
        window.onload = () => {
            // Set initial BPM
            handleBPMChange(bpmInput.value); 
            // Create the sequencer buttons
            createSequencerGrid();
            // Initialize Tone.js and instruments
            initializeTone();
        };

    </script>

</body>
</html>
